esphome:
  name: soilsense

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret home_assistant_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

mqtt:
  broker: ha.pi.lan
  username: soilsense
  password: !secret mqtt_password

i2c:
  sda: GPIO0
  scl: GPIO2
  scan: True

ads1115:
  - address: 0x48
sensor:
  # ADS1115 with capacitive moisture sensor connected to A0 and GND
  - platform: ads1115
    multiplexer: "A0_GND"
    gain: 4.096
    name: "Moisture Sensor"

  # GXHT30
  - platform: sht3xd
    temperature:
      name: "Room Temperature"
    humidity:
      name: "Room Humidity"
    address: 0x44
    update_interval: 60s

deep_sleep:
  run_duration: 10s
  sleep_duration: 30min
